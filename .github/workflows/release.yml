name: Release

# Publishes the version in pyproject.toml as a GitHub release, with the wheel
# (web app inside) and its SHA-256 attached. Two ways to start it:
#   - push a tag v<version>, or
#   - run this workflow by hand from main (Actions, Release, Run workflow);
#     it then creates the tag v<version> on that commit.
# A version that already has a release is refused: bump pyproject.toml first.
#
# The wheel is what "Update Saltbox UI" installs, as root, on every server that
# runs this. So the job that runs build tools and their dependencies cannot
# write to the repository, and the job that can write runs nothing but the
# upload. Actions are pinned to commits, not to tags that can be moved.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: false # nothing another workflow run left behind goes into a release

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Work out the tag and check it can be released
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "odd version: $version" >&2; exit 1; }
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "$GITHUB_REF_NAME" = "$tag" ] || { echo "tag $GITHUB_REF_NAME, package $version" >&2; exit 1; }
            # A tag can be pushed on any commit; only one that is on main is released.
            where=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
            case "$where" in
              ahead|identical) ;;
              *) echo "$tag is not on main ($where)" >&2; exit 1 ;;
            esac
          else
            [ "$GITHUB_REF_NAME" = "main" ] || { echo "run this from main, not $GITHUB_REF_NAME" >&2; exit 1; }
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released; bump the version in pyproject.toml" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the wheel and check the web app is in it
        run: |
          uv build --wheel --python 3.12 --out-dir dist
          python3 -c 'import glob,zipfile; n=zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist(); assert "saltbox_ui/web_dist/index.html" in n, "no web app in the wheel"'
          (cd dist && sha256sum -- *.whl > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
